version: 2

models:
  - name: stg_events
    description: Deduplicated events, one row per event_id.
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: event_type
        tests:
          - accepted_values:
              values: [page_view, add_to_cart, order_placed, payment]
      - name: event_ts
        tests: [not_null]

  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: currency
        tests:
          - accepted_values:
              values: [USD]

  - name: stg_order_items
    columns:
      - name: order_id
        tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

  - name: stg_payments
    columns:
      - name: payment_status
        tests:
          - accepted_values:
              values: [authorized, declined]
